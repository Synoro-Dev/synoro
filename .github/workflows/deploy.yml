name: Deploy

# Builds the images (app, demo, tools, landing) and pushes them to GHCR. That is the whole deploy: the
# cluster picks the new images up itself (Keel polls GHCR and restarts the
# Deployments annotated in the infra repo), so this workflow needs no
# kubeconfig, no access to the infra repo and no reachable k3s API.
#
# Runs after CI passes on a push to main, or by hand (Actions -> Deploy -> Run
# workflow) to rebuild a commit of main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One build at a time; a newer commit waits instead of cancelling a push
# halfway through (which could leave `tools` and `app` from different commits).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/synoro-dev
  # workflow_run carries the commit CI tested; a manual run builds the tip.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Migrations and the worker, for production and the demo alike. Pushed before
  # the app: the cluster restarts the app as soon as it sees the new app image,
  # and its `migrate` init container must already find the matching migrations.
  tools:
    # This repo is public: CI also runs for pull requests from forks, and
    # workflow_run would hand their code our secrets. Build pushes to main of
    # this repo only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit tag is for rollbacks and traceability; the cluster follows
      # the moving tags: `latest` (production) and `demo` (demo.yaml names it).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ env.REGISTRY }}/synoro-tools:${{ env.SHA }}
            ${{ env.REGISTRY }}/synoro-tools:latest
            ${{ env.REGISTRY }}/synoro-tools:demo
          # Links the package to this repo, which grants this workflow write
          # access to it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

  app:
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # NEXT_PUBLIC_* are baked into the client bundle: keep them in sync
          # with the ConfigMaps in the infra repo (synoro/config.yaml, demo.yaml).
          - name: app
            tag: ""
            moving-tag: latest
            build-args: |
              NEXT_PUBLIC_APP_URL=https://app.synoro.ru
              NEXT_PUBLIC_APP_NAME=Synoro
              NEXT_PUBLIC_APP_SHORT_NAME=Synoro
          - name: app-demo
            tag: demo-
            moving-tag: demo
            build-args: |
              NEXT_PUBLIC_APP_URL=https://demo.synoro.ru
              NEXT_PUBLIC_APP_NAME=Synoro Demo
              NEXT_PUBLIC_APP_SHORT_NAME=Synoro
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/synoro-app:${{ matrix.tag }}${{ env.SHA }}
            ${{ env.REGISTRY }}/synoro-app:${{ matrix.moving-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The landing (apps/web) on synoro.ru: no database, so it neither waits for
  # `tools` nor needs migrations.
  web:
    # Same guard as `tools`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are baked into the client bundle. The demo link and the
      # Metrika counter are optional: set the repository variables
      # NEXT_PUBLIC_DEMO_URL / NEXT_PUBLIC_YANDEX_METRIKA_ID to enable them.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://synoro.ru
            NEXT_PUBLIC_DEMO_URL=${{ vars.NEXT_PUBLIC_DEMO_URL }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/synoro-landing:${{ env.SHA }}
            ${{ env.REGISTRY }}/synoro-landing:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
